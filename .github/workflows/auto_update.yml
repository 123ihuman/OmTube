name: Auto Update Cloudflare D1

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours (6 times a day)
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Increased timeout to prevent premature kills
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yt-dlp

      - name: Run Auto Updater
        run: python auto_update.py
